<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – LibraryOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-bg">
    <div class="auth-orb orb1"></div>
    <div class="auth-orb orb2"></div>
    <div class="auth-orb orb3"></div>
</div>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-icon"><i class="fas fa-user-plus"></i></div>
            <h1>Create Account</h1>
            <p>Join LibraryOS as a member</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash-msg flash-{{ category }}" style="margin-bottom:1rem;">
                <i class="fas fa-info-circle"></i><span>{{ message }}</span>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="name" class="form-ctrl" placeholder="John Doe" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" name="email" class="form-ctrl" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" name="phone" class="form-ctrl" placeholder="+91 9876543210">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" id="regPassword" class="form-ctrl" placeholder="Min 6 characters" required minlength="6">
                    <button type="button" class="password-toggle" onclick="togglePwd('regPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary-full">
                <span>Create Account</span><i class="fas fa-arrow-right"></i>
            </button>
        </form>
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
        </div>
    </div>
</div>
<script>
function togglePwd(id, btn) {
    const el = document.getElementById(id);
    const icon = btn.querySelector('i');
    el.type = el.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
}
</script>
</body>
</html>
